name: Issue to PR

# A maintainer reviews every "event-submission" issue (filed via the GitHub
# issue form, or via the /submit web form -> Netlify function -> GitHub API)
# and adds the "approved" label once it looks legitimate. That label is the
# spam/junk gate for the web form, which is open to the public internet.
# Only then do we turn it into an event file and open a PR for full review.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'event-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate event file from issue
        id: generate
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/issue-to-event.mjs

      - name: Check for new event file
        id: check
        run: |
          if git status --porcelain src/content/events | grep -q '^??'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.generate.outcome == 'success' && steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add event from issue #${{ github.event.issue.number }}"
          branch: "submission/issue-${{ github.event.issue.number }}"
          title: "Add event: closes #${{ github.event.issue.number }}"
          body: |
            Generated from #${{ github.event.issue.number }} after maintainer approval.
            Review the event details before merging — this does not auto-publish.
          labels: event-submission

      - name: Comment if generation failed
        if: steps.generate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Couldn't generate a valid event from this issue — check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details (likely a missing or malformed field).",
            });

      - name: Comment if duplicate
        if: steps.generate.outcome == 'success' && steps.check.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This event already exists in the tracker — no PR needed.",
            });
